{% extends "base.html" %}

{% block content %}

<style>

:root{
    --primary:#ff6b35;
    --primary-dark:#e85928;
    --secondary:#ffb84d;
    --bg:#fff4ee;
    --text:#222;
    --muted:#777;
}

body{
    background:
    radial-gradient(circle at top left,#ffd7c7 0%,transparent 35%),
    radial-gradient(circle at bottom right,#ffe8b5 0%,transparent 35%),
    var(--bg);
}

/* ====================
   Wrapper
==================== */

.expense-wrapper{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
    position:relative;
}

/* ====================
   Decorative Blobs
==================== */

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    z-index:1;
}

.blob1{
    width:350px;
    height:350px;
    background:#ff9a76;
    top:50px;
    left:-120px;
    opacity:.35;
}

.blob2{
    width:300px;
    height:300px;
    background:#ffd36a;
    right:-80px;
    bottom:0;
    opacity:.4;
}

/* ====================
   Card
==================== */

.expense-card{

    width:100%;
    max-width:760px;

    background:rgba(255,255,255,.65);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.6);

    border-radius:32px;

    padding:50px;

    position:relative;
    z-index:10;

    box-shadow:
    0 25px 50px rgba(0,0,0,.08);
}

/* ====================
   Header
==================== */

.badge{

    display:inline-flex;
    align-items:center;

    background:#fff0e9;

    color:var(--primary);

    padding:8px 15px;

    border-radius:999px;

    font-size:13px;
    font-weight:600;

    margin-bottom:20px;
}

.page-title{

    font-size:48px;
    font-weight:800;
    color:var(--text);

    margin-bottom:10px;
}

.page-subtitle{

    color:var(--muted);

    font-size:16px;

    margin-bottom:40px;
}

/* ====================
   Form Grid
==================== */

.form-grid{
    display:grid;
    gap:25px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-label{
    font-weight:600;
    margin-bottom:10px;
    color:#444;
}

/* ====================
   Inputs
==================== */

.form-control{

    height:60px;

    border:2px solid transparent;

    border-radius:18px;

    background:white;

    padding:0 18px;

    font-size:15px;

    transition:.3s;

    box-shadow:
    0 4px 15px rgba(0,0,0,.03);
}

.form-control:focus{

    outline:none;

    border-color:var(--primary);

    box-shadow:
    0 0 0 5px rgba(255,107,53,.12);
}

/* ====================
   Upload Box
==================== */

.upload-box{

    border:2px dashed #ffbeaa;

    background:#fffaf7;

    border-radius:20px;

    padding:25px;

    text-align:center;

    transition:.3s;
}

.upload-box:hover{

    background:white;

    border-color:var(--primary);
}

.upload-box input{

    width:100%;
}

.upload-text{

    color:#666;

    margin-top:10px;

    font-size:14px;
}

/* ====================
   Buttons
==================== */

.button-group{

    display:flex;
    gap:15px;

    margin-top:40px;
}

.cancel-btn{

    flex:1;

    height:58px;

    border-radius:18px;

    background:white;

    border:2px solid #e6e6e6;

    color:#555;

    font-weight:600;

    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.3s;
}

.cancel-btn:hover{

    background:#f8f8f8;

    border-color:#d0d0d0;
}

.save-btn{

    flex:1;

    height:58px;

    border:none;

    border-radius:18px;

    background:linear-gradient(
        135deg,
        var(--primary),
        #ff8c42
    );

    color:white;

    font-weight:700;

    transition:.3s;

    box-shadow:
    0 15px 30px rgba(255,107,53,.25);
}

.save-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 20px 35px rgba(255,107,53,.35);
}

/* ====================
   Responsive
==================== */

@media(max-width:768px){

    .expense-card{
        padding:30px;
    }

    .page-title{
        font-size:34px;
    }

    .button-group{
        flex-direction:column;
    }
}

</style>

<div class="expense-wrapper">

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="expense-card">

        <div class="badge">
            💰 Expense Management
        </div>

        <h1 class="page-title">
            Add New Expense
        </h1>

        <p class="page-subtitle">
            Track spending, upload receipts, and keep your finances organized.
        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">

                    <label class="form-label">
                        Expense Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Netflix Subscription"
                        required>

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        class="form-control"
                        placeholder="₹ 0.00"
                        required>

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Category
                    </label>

                    <input
                        type="text"
                        name="category"
                        class="form-control"
                        placeholder="Food, Travel, Shopping..."
                        required>

                </div>

                <div class="form-group">

                    <label class="form-label">
                        Receipt Upload
                    </label>

                    <div class="upload-box">

                        <input
                            type="file"
                            name="receipt">

                        <div class="upload-text">
                            Drag & drop receipt here or click to browse
                        </div>

                    </div>

                </div>

            </div>

            <div class="button-group">

                <a href="/expenses/" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="save-btn">
                    Save Expense
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
