{% extends "base.html" %}

{% block content %}

<style>

    body{
        background:#f7d9c7;
    }

    .expense-wrapper{

        min-height:90vh;

        display:flex;
        justify-content:center;
        align-items:center;

        padding:40px 20px;

        position:relative;

        overflow:hidden;
    }

    /* Background Blur */

    .blur1{

        position:absolute;

        width:300px;
        height:300px;

        background:#ff9e7a;

        border-radius:50%;

        filter:blur(120px);

        left:-100px;
        top:100px;

        opacity:0.5;
    }

    .blur2{

        position:absolute;

        width:250px;
        height:250px;

        background:#fff0b3;

        border-radius:50%;

        filter:blur(120px);

        right:-50px;
        bottom:0;

        opacity:0.5;
    }

    /* Main Card */

    .expense-card{

        width:100%;

        max-width:700px;

        background:rgba(255,255,255,0.35);

        backdrop-filter:blur(20px);

        border-radius:30px;

        padding:45px;

        position:relative;

        z-index:10;

        box-shadow:
        0 20px 40px rgba(0,0,0,0.12);
    }

    .page-title{

        font-size:45px;

        font-weight:700;

        color:#2d2d2d;

        margin-bottom:10px;
    }

    .page-subtitle{

        color:#666;

        margin-bottom:35px;

        font-size:16px;
    }

    /* Form */

    .form-label{

        color:#444;

        font-weight:600;

        margin-bottom:10px;
    }

    .form-control{

        height:58px;

        border:none;

        border-radius:16px;

        background:#ffffffd6;

        padding-left:18px;

        font-size:15px;

        transition:0.3s;
    }

    .form-control:focus{

        box-shadow:none;

        border:2px solid #ff7b42;

        background:white;
    }

    input[type="file"]{

        padding-top:15px;
    }

    /* Buttons */

    .button-group{

        display:flex;
        justify-content:space-between;

        margin-top:35px;

        gap:15px;
    }

    .cancel-btn{

        flex:1;

        height:55px;

        border:none;

        border-radius:16px;

        background:#d1d5db;

        color:#2d2d2d;

        font-weight:600;

        text-decoration:none;

        display:flex;
        justify-content:center;
        align-items:center;

        transition:0.3s;
    }

    .cancel-btn:hover{

        background:#bfc5cc;

        color:#2d2d2d;
    }

    .save-btn{

        flex:1;

        height:55px;

        border:none;

        border-radius:16px;

        background:linear-gradient(135deg,#ff7b42,#ff5a1f);

        color:white;

        font-weight:600;

        transition:0.3s;

        box-shadow:
        0 10px 20px rgba(255,90,31,0.25);
    }

    .save-btn:hover{

        transform:translateY(-2px);

        box-shadow:
        0 15px 25px rgba(255,90,31,0.35);
    }

    /* Responsive */

    @media(max-width:768px){

        .expense-card{

            padding:30px 25px;
        }

        .page-title{

            font-size:35px;
        }

        .button-group{

            flex-direction:column;
        }
    }

</style>

<div class="expense-wrapper">

    <!-- Blur -->

    <div class="blur1"></div>
    <div class="blur2"></div>

    <!-- Card -->

    <div class="expense-card">

        <h1 class="page-title">
            Add Expense
        </h1>

        <p class="page-subtitle">
            Add and organize your financial records securely
        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <!-- Title -->

            <div class="mb-4">

                <label class="form-label">
                    Expense Title
                </label>

                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Enter expense title"
                       required>

            </div>

            <!-- Amount -->

            <div class="mb-4">

                <label class="form-label">
                    Amount
                </label>

                <input type="number"
                       step="0.01"
                       name="amount"
                       class="form-control"
                       placeholder="Enter amount"
                       required>

            </div>

            <!-- Category -->

            <div class="mb-4">

                <label class="form-label">
                    Category
                </label>

                <input type="text"
                       name="category"
                       class="form-control"
                       placeholder="Food, Travel, Shopping..."
                       required>

            </div>

            <!-- Receipt -->

            <div class="mb-4">

                <label class="form-label">
                    Upload Receipt
                </label>

                <input type="file"
                       name="receipt"
                       class="form-control">

            </div>

            <!-- Buttons -->

            <div class="button-group">

                <a href="/expenses/"
                   class="cancel-btn">

                    Cancel

                </a>

                <button type="submit"
                        class="save-btn">

                    Save Expense

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
