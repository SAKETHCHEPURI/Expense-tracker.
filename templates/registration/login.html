<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:#f7d9c7;

            overflow:hidden;

            position:relative;
        }

        /* Background Blur */

        .blur1{

            position:absolute;

            width:350px;
            height:350px;

            background:#ff9e7a;

            border-radius:50%;

            filter:blur(120px);

            left:-100px;
            bottom:-80px;

            opacity:0.5;
        }

        .blur2{

            position:absolute;

            width:250px;
            height:250px;

            background:#fff0b3;

            border-radius:50%;

            filter:blur(120px);

            top:-80px;
            left:250px;

            opacity:0.5;
        }

        /* Main Container */

        .main-container{

            width:1200px;
            height:680px;

            background:rgba(255,255,255,0.18);

            backdrop-filter:blur(15px);

            border-radius:35px;

            display:flex;

            overflow:hidden;

            position:relative;

            z-index:10;

            box-shadow:
            0 20px 40px rgba(0,0,0,0.15);
        }

        /* LEFT PANEL */

        .left-panel{

            width:45%;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px;
        }

        .login-card{

            width:100%;
            max-width:420px;

            background:rgba(255,255,255,0.35);

            backdrop-filter:blur(20px);

            border-radius:30px;

            padding:50px 40px;

            box-shadow:
            0 10px 30px rgba(0,0,0,0.08);
        }

        .logo{

            color:#ff6b35;

            font-size:18px;

            font-weight:500;

            margin-bottom:5px;
        }

        .title{

            font-size:55px;

            font-weight:700;

            color:#2d2d2d;

            margin-bottom:35px;
        }

        .form-label{

            color:#444;

            font-weight:500;

            margin-bottom:8px;
        }

        .form-control{

            height:55px;

            border:none;

            border-radius:14px;

            background:#ffffffc9;

            padding-left:18px;

            font-size:15px;
        }

        .form-control:focus{

            box-shadow:none;

            border:2px solid #ff7b42;
        }

        .password-box{

            position:relative;
        }

        .eye-icon{

            position:absolute;

            right:18px;
            top:17px;

            color:#999;

            cursor:pointer;
        }

        .forgot{

            text-align:right;

            margin-top:10px;
            margin-bottom:25px;
        }

        .forgot a{

            text-decoration:none;

            color:#ff6b35;

            font-size:14px;

            font-weight:500;
        }

        .btn-login{

            width:100%;

            height:55px;

            border:none;

            border-radius:14px;

            background:#ff5a1f;

            color:white;

            font-size:17px;

            font-weight:600;

            transition:0.3s;
        }

        .btn-login:hover{

            background:#e34d16;

            transform:translateY(-2px);
        }

        .divider{

            text-align:center;

            margin:30px 0;

            color:#555;
        }

        .social-buttons{

            display:flex;

            justify-content:center;

            gap:18px;
        }

        .social-btn{

            width:55px;
            height:55px;

            border-radius:16px;

            background:white;

            border:none;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:22px;

            box-shadow:
            0 5px 15px rgba(0,0,0,0.08);

            transition:0.3s;
        }

        .social-btn:hover{

            transform:translateY(-3px);
        }

        .register{

            margin-top:40px;

            text-align:center;

            color:#444;
        }

        .register a{

            color:#ff6b35;

            text-decoration:none;

            font-weight:600;
        }

        /* RIGHT PANEL */

        .right-panel{

            flex:1;

            display:flex;
            justify-content:center;
            align-items:center;

            position:relative;
        }

        .hero-content{

            text-align:center;

            padding:40px;
        }

        .hero-image{

            width:420px;
            height:420px;

            border-radius:50%;

            object-fit:cover;

            border:8px solid rgba(255,255,255,0.35);

            padding:15px;

            background:rgba(255,255,255,0.15);

            box-shadow:
            0 20px 40px rgba(0,0,0,0.15);

            animation:float 4s ease-in-out infinite;
        }

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(-15px);
            }

            100%{
                transform:translateY(0px);
            }
        }

        .hero-title{

            margin-top:25px;

            font-size:42px;

            font-weight:700;

            color:#2d2d2d;
        }

        .hero-subtitle{

            margin-top:15px;

            font-size:18px;

            color:#555;

            line-height:1.8;
        }

        /* Responsive */

        @media(max-width:1000px){

            .right-panel{
                display:none;
            }

            .left-panel{
                width:100%;
            }

            .main-container{

                width:95%;
                height:auto;
            }
        }

    </style>

</head>

<body>

<div class="blur1"></div>
<div class="blur2"></div>

<div class="main-container">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="login-card">

            <div class="logo">
                Expense Tracker
            </div>

            <h1 class="title">
                Login
            </h1>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-4">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="username@gmail.com">

                </div>

                <div class="mb-3 password-box">

                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Password">



                </div>



                <button type="submit" class="btn btn-login">
                    Sign In
                </button>

            </form>






            <div class="register">

                Don’t have an account yet?

                <a href="/signup/">
                    Sign Up
                </a>

            </div>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="hero-content">

            <img src="https://file.aiquickdraw.com/imgcompressed/img/compressed_cd02f18fc4435dfa45ecedc672ebc296.webp"
                 class="hero-image">

            <h2 class="hero-title">
                Expense Tracker
            </h2>



        </div>

    </div>

</div>

</body>
</html>
