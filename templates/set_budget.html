{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card p-4 shadow">

                <h2 class="mb-4 text-center">
                    Set Monthly Budget
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Monthly Budget
                        </label>

                        <input type="number"
                               step="0.01"
                               name="budget"
                               class="form-control"
                               placeholder="Enter amount"
                               required>

                    </div>

                    <button class="btn btn-success w-100">

                        Save Budget

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
