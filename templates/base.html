<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            background:#f7d9c7;

            min-height:100vh;

            overflow-x:hidden;
        }

        /* NAVBAR */

        .custom-navbar{

            width:100%;

            padding:18px 40px;

            display:flex;
            justify-content:space-between;
            align-items:center;

            background:rgba(255,255,255,0.15);

            backdrop-filter:blur(15px);

            border-bottom:1px solid rgba(255,255,255,0.2);

            position:sticky;

            top:0;

            z-index:999;
        }

        .logo{

            display:flex;
            align-items:center;

            gap:12px;

            text-decoration:none;
        }

        .logo-icon{

            width:45px;
            height:45px;

            border-radius:12px;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(135deg,#ff7b42,#ff5a1f);

            color:white;

            font-size:20px;

            box-shadow:
            0 5px 15px rgba(255,90,31,0.3);
        }

        .logo-text{

            font-size:28px;

            font-weight:700;

            color:#2d2d2d;
        }

        .nav-right{

            display:flex;
            align-items:center;

            gap:20px;
        }

        .welcome-text{

            font-size:16px;

            color:#333;

            font-weight:500;
        }

        .logout-btn{

            border:none;

            padding:10px 22px;

            border-radius:12px;

            background:linear-gradient(135deg,#ff5a1f,#e34d16);

            color:white;

            font-weight:600;

            transition:0.3s;
        }

        .logout-btn:hover{

            transform:translateY(-2px);

            box-shadow:
            0 8px 20px rgba(255,90,31,0.3);
        }

        /* MAIN CONTENT */

        .main-content{

            padding:30px;
        }

        /* Responsive */

        @media(max-width:768px){

            .custom-navbar{

                padding:15px 20px;
            }

            .logo-text{

                font-size:22px;
            }

            .welcome-text{

                display:none;
            }

            .logout-btn{

                padding:8px 16px;

                font-size:14px;
            }
        }
        .dark-mode{

    background:#121212 !important;

    color:white !important;
}

.dark-mode .custom-navbar{

    background:#1e1e1e !important;

    border-bottom:none;
}

.dark-mode .logo-text,
.dark-mode .welcome-text{

    color:white !important;
}

.dark-mode .main-content{

    background:#121212 !important;
}

    </style>

</head>

<body>

<!-- NAVBAR -->

{% block navbar %}

<nav class="custom-navbar">

    <!-- LOGO -->

    <a href="/expenses/" class="logo">

        <div class="logo-icon">
            <i class="bi bi-cash-coin"></i>
        </div>

        <div class="logo-text">
            Expense Tracker
        </div>

    </a>

    <!-- RIGHT -->

    {% if user.is_authenticated %}

    <div class="nav-right">

        <div class="welcome-text">

            Welcome,
            <strong>{{ user.username }}</strong>

        </div>

        <button id="themeToggle"
        type="button"
        style="
        border:none;
        background:#750e0e;
        color:white;
        padding:10px 18px;
        border-radius:12px;
        cursor:pointer;
        font-size:18px;">
    🌙
</button>

            {% csrf_token %}

            <button class="logout-btn">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>

        </form>

    </div>

    {% endif %}

</nav>

{% endblock %}

<!-- PAGE CONTENT -->

<div class="main-content">

    {% block content %}
    {% endblock %}

</div>
<script>

const toggleBtn = document.getElementById("themeToggle");

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark-mode");

    toggleBtn.innerHTML = "☀️";
}

toggleBtn.addEventListener("click", () => {

    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){

        localStorage.setItem("theme","dark");

        toggleBtn.innerHTML = "☀️";
    }
    else{

        localStorage.setItem("theme","light");

        toggleBtn.innerHTML = "🌙";
    }

});

</script>
</body>
</html>
